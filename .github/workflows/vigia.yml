# Vigía de fuentes de la Ley 27.795 (ADR 0010, 0032 y 0033).
# - Cada 3 horas: carga sola lo verificable (normas de InfoLEG, actas del Senado, notas de prensa que coinciden con un
#   hito) y la fecha de consulta; si la validación y los tests pasan, hace commit en main y Vercel publica. Lo que no se
#   puede verificar así queda en el issue «vigia-ley» para revisar a mano.
# - Los lunes: títulos de prensa, enlaces caídos y copias en la Wayback Machine.
name: Vigía de fuentes de la ley

on:
  schedule:
    - cron: "0 */3 * * *"  # cada 3 horas
    - cron: "0 13 * * 1"   # los lunes, 10:00 de Argentina
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: vigia-ley
  cancel-in-progress: false

env:
  ETIQUETA: vigia-ley
  TITULO: "Novedades en fuentes de la Ley 27.795"

jobs:
  actualizar:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 */3 * * *'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Cargar novedades verificables
        run: python scripts/actualizar_ley.py --salida informe.md
      - name: Validar y publicar
        id: publicar
        run: |
          if [ -z "$(git status --porcelain data/)" ]; then echo "Sin cambios en data/."; exit 0; fi
          if python scripts/validar_datos.py && python -m pytest -q; then
            git config user.name "vigia-ley[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/
            git commit -m "Ley 27.795: novedades automáticas del $(TZ=America/Argentina/Buenos_Aires date +'%d/%m/%Y %H:%M') (ADR 0033)"
            git push
          else
            git checkout -- data/ && git clean -fd data/
            { echo; echo "### No se publicó: falló la validación o los tests"; echo "Ver el registro de esta corrida: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"; } >> informe.md
          fi
      - name: Avisar en el issue
        if: hashFiles('informe.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create "$ETIQUETA" --color 2A78D6 --description "Avisos del vigía de fuentes de la ley" --force
          numero=$(gh issue list --label "$ETIQUETA" --state open --json number --jq '.[0].number')
          if [ -n "$numero" ]; then
            gh issue comment "$numero" --body-file informe.md
          else
            gh issue create --title "$TITULO" --label "$ETIQUETA" --body-file informe.md
          fi

  enlaces:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 13 * * 1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Títulos, enlaces y copias
        id: revisar
        run: |
          set +e
          python scripts/verificar_titulos.py > titulos.txt; titulos=$?
          python scripts/verificar_enlaces.py > enlaces.txt; enlaces=$?
          python scripts/archivar_fuentes.py --revisar > archivo.txt
          {
            echo "Revisión semanal del $(date -u +%d/%m/%Y)."
            echo
            echo "### Títulos de prensa (\`scripts/verificar_titulos.py\`)"; echo '```'; cat titulos.txt; echo '```'
            echo "### Enlaces (\`scripts/verificar_enlaces.py\`)"; echo '```'; cat enlaces.txt; echo '```'
            echo "### Copias en la Wayback Machine"; echo; tail -n 1 archivo.txt
            echo "Para registrarlas: \`.venv/bin/python scripts/archivar_fuentes.py --guardar\`."
          } > revision.md
          cat revision.md >> "$GITHUB_STEP_SUMMARY"
          if [ $titulos -ne 0 ] || [ $enlaces -ne 0 ]; then echo "fallo=1" >> "$GITHUB_OUTPUT"; fi
      - name: Avisar en el issue
        if: steps.revisar.outputs.fallo == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create "$ETIQUETA" --color 2A78D6 --description "Avisos del vigía de fuentes de la ley" --force
          numero=$(gh issue list --label "$ETIQUETA" --state open --json number --jq '.[0].number')
          if [ -n "$numero" ]; then
            gh issue comment "$numero" --body-file revision.md
          else
            gh issue create --title "$TITULO" --label "$ETIQUETA" --body-file revision.md
          fi
