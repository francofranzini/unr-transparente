- id: ley-27795-queja-camara
  fecha: "2026-10-15"
  tipo: judicial
  ejes: [ley]
  titulo: "La Sala III admite la queja del Gobierno y concede su apelación contra la intimación del 22 de septiembre"
  tipo_fuente: primaria
  documento: "Cámara Contencioso Administrativo Federal, Sala III, CAF 39475/2025/2/1/RH3, resolución del 15-oct-2026 (Fernández, López Castiñeira, Morán). Copia publicada por Class Actions Argentina (PDF con firma digital del Poder Judicial)"
  url: https://classactionsargentina.com/wp-content/uploads/2026/10/2026-10-15-cnacfed-sala-iii_cin-c.-pen-admite-queja-en-ejecucion.pdf
  pagina: 7
  consultado: 2026-10-19
  nota: "Resuelve «hacer lugar al presente recurso de queja por apelación denegada» y conceder «en relación (conf. art. 243 del CPCCN)» la apelación contra la providencia del 22-sep-2026, sin adelantar opinión «acerca del cabal cumplimiento o no de la medida cautelar». No dice qué efecto tiene la apelación sobre las multas: la prensa informa que quedaron suspendidas provisoriamente; otras lecturas sostienen que siguen vigentes."
